<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Culture Quiz - 200 Questions Pro</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e293b);
            --card-bg: rgba(30, 41, 59, 0.95);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --correct: #22c55e;
            --incorrect: #ef4444;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 650px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .title {
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-align: center;
            color: var(--primary);
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .cat-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text);
            padding: 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
        }

        .cat-btn span {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: normal;
        }

        .cat-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .badge {
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .question-number {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .score-tracker {
            font-size: 0.95rem;
            color: var(--primary);
            font-weight: 700;
        }

        h2#question-text {
            font-size: 1.25rem;
            margin-bottom: 20px;
            line-height: 1.5;
            min-height: 60px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
        }

        .option-btn.correct {
            background-color: var(--correct) !important;
            border-color: var(--correct);
            color: white;
        }

        .option-btn.incorrect {
            background-color: var(--incorrect) !important;
            border-color: var(--incorrect);
            color: white;
        }

        .action-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: var(--primary-hover);
        }

        .result-screen {
            text-align: center;
        }

        .result-screen h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .result-screen p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="quiz-container">

        <div id="category-screen" class="screen active">
            <h1 class="title">Grand Quiz - 200 Questions</h1>
            <p class="subtitle">Sélectionnez un thème pour lancer une session de 20 questions aléatoires</p>
            
            <div class="category-grid">
                <button class="cat-btn" onclick="startQuiz('general')">
                    🌍 Culture Générale
                    <span>50 questions dispo</span>
                </button>
                <button class="cat-btn" onclick="startQuiz('histoire')">

                </button>
                <button class="cat-btn" onclick="startQuiz('sciences')">
                    🔬 Sciences & Nature

                </button>
                <button class="cat-btn" onclick="startQuiz('divertissement')">
                    🎬 Divertissement
                    <span>50 questions dispo</span>
                </button>
            </div>
        </div>

        <!-- ÉCRAN 2 : JEU EN COURS -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <span id="category-badge" class="badge">THÈME</span>
                <span class="question-number" id="question-number">Question 1/20</span>
                <span class="score-tracker" id="score-tracker">Score : 0</span>
            </div>
            
            <h2 id="question-text">Chargement...</h2>
            
            <div class="options-list" id="options-list"></div>

            <button class="action-btn" id="next-btn" style="display: none;">Question suivante</button>
        </div>

        <!-- ÉCRAN 3 : RÉSULTATS -->
        <div id="result-screen" class="screen result-screen">
            <h2>Session Terminée ! 🎉</h2>
            <p id="final-score-text">Votre score : 0 sur 20</p>
            
            <div class="btn-group">
                <button class="action-btn" onclick="showCategorySelect()">Changer de thème</button>
                <button class="action-btn" style="background: rgba(255,255,255,0.1);" onclick="restartCategory()">Rejouer ce thème</button>
            </div>
        </div>
    </div>

        let activeCategory = '';
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startQuiz(category) {
            activeCategory = category;
            score = 0;
            currentQuestionIndex = 0;

            const rawPool = database[category];
            const shuffledPool = shuffleArray(rawPool);
            
            // Sélectionne 20 questions aléatoires parmi les 50 disponibles dans la catégorie
            const selectedPool = shuffledPool.slice(0, 20);

            currentQuestions = selectedPool.map(item => {
                const optionsWithMeta = item.o.map((opt, idx) => ({ text: opt, isCorrect: idx === item.c }));
                const shuffledOpts = shuffleArray(optionsWithMeta);
                return {
                    question: item.q,
                    options: shuffledOpts.map(o => o.text),
                    correct: shuffledOpts.findIndex(o => o.isCorrect)
                };
            });

            document.getElementById('category-badge').textContent = category.toUpperCase();
            showScreen('quiz-screen');
            loadQuestion();
        }

        function loadQuestion() {
            const nextBtn = document.getElementById('next-btn');
            nextBtn.style.display = 'none';

            const q = currentQuestions[currentQuestionIndex];
            document.getElementById('question-number').textContent = `Question ${currentQuestionIndex + 1}/${currentQuestions.length}`;
            document.getElementById('score-tracker').textContent = `Score : ${score}`;
            document.getElementById('question-text').textContent = q.question;

            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';

            q.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn');
                btn.textContent = optText;
                btn.onclick = () => selectOption(index, btn);
                optionsList.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, selectedBtn) {
            const q = currentQuestions[currentQuestionIndex];
            const allBtns = document.querySelectorAll('.option-btn');

            allBtns.forEach(btn => btn.disabled = true);

            if (selectedIndex === q.correct) {
                selectedBtn.classList.add('correct');
                score++;
                document.getElementById('score-tracker').textContent = `Score : ${score}`;
            } else {
                selectedBtn.classList.add('incorrect');
                allBtns[q.correct].classList.add('correct');
            }

            const nextBtn = document.getElementById('next-btn');
            nextBtn.style.display = 'block';
            nextBtn.onclick = () => {
                currentQuestionIndex++;
                if (currentQuestionIndex < currentQuestions.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            };
        }

        function showResults() {
            document.getElementById('final-score-text').textContent = `Votre score final est de ${score} sur ${currentQuestions.length} (${Math.round((score/currentQuestions.length)*100)}%)`;
            showScreen('result-screen');
        }

        function showCategorySelect() {
            showScreen('category-screen');
        }

        function restartCategory() {
            startQuiz(activeCategory);
        }
